
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fincontagion-x"
version = "0.1.0"
description = "Financial contagion and systemic stress simulation platform"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=3.0",
    "scikit-learn>=1.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
